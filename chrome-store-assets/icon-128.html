<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  body { width: 128px; height: 128px; overflow: hidden; }
  .icon {
    width: 128px;
    height: 128px;
    background: linear-gradient(145deg, #1A1A2E 0%, #0F0F10 100%);
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  /* Subtle grid pattern */
  .icon::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(108, 92, 231, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108, 92, 231, 0.03) 1px, transparent 1px);
    background-size: 8px 8px;
  }
  /* Glow effect */
  .icon::after {
    content: '';
    position: absolute;
    width: 80px;
    height: 40px;
    background: radial-gradient(ellipse, rgba(108, 92, 231, 0.25) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  svg {
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 0 8px rgba(108, 92, 231, 0.5));
  }
</style>
</head>
<body>
<div class="icon">
  <svg width="90" height="60" viewBox="0 0 90 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Pulse line with gradient -->
    <defs>
      <linearGradient id="pulseGrad" x1="0" y1="30" x2="90" y2="30" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.2"/>
        <stop offset="20%" stop-color="#6C5CE7" stop-opacity="0.8"/>
        <stop offset="50%" stop-color="#A29BFE" stop-opacity="1"/>
        <stop offset="80%" stop-color="#6C5CE7" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#6C5CE7" stop-opacity="0.2"/>
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <!-- Background pulse (wider, dimmer) -->
    <polyline
      points="0,30 15,30 22,30 28,18 34,42 40,8 46,52 52,20 58,38 64,30 72,30 90,30"
      stroke="rgba(108, 92, 231, 0.15)"
      stroke-width="6"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Main pulse line -->
    <polyline
      points="0,30 15,30 22,30 28,18 34,42 40,8 46,52 52,20 58,38 64,30 72,30 90,30"
      stroke="url(#pulseGrad)"
      stroke-width="3.5"
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#glow)"
    />
    <!-- Bright center dot -->
    <circle cx="40" cy="8" r="2.5" fill="#A29BFE" opacity="0.9"/>
  </svg>
</div>
</body>
</html>
